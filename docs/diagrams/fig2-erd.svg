<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="920" viewBox="0 0 1420 920" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1420" height="920" fill="#FFFFFF"/>

  <text x="710" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#21302F">Paws&amp;Found Revised Entity Relationship Diagram</text>
  <text x="710" y="58" text-anchor="middle" font-size="13" fill="#667573">11 tables · 20 foreign keys · MySQL / MariaDB. Shaded rows are primary keys; italics are foreign keys.</text>

  <!-- ================= pet_categories ================= -->
