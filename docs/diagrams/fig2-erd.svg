  <!-- crow's-foot style "many" ticks at the child end -->
  <g stroke="#5C7370" stroke-width="1.4" fill="none">
    <path d="M384 204 l-8 -5 M384 204 l-8 5"/>
    <path d="M754 140 l-8 -5 M754 140 l-8 5"/>
    <path d="M754 280 l-8 -5 M754 280 l-8 5"/>
    <path d="M754 418 l-8 -5 M754 418 l-8 5"/>
