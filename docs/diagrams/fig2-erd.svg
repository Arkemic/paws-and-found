  <!-- ================= RELATIONSHIP LINES ================= -->
  <g stroke="#5C7370" stroke-width="1.4" fill="none">
    <!-- categories -> breeds -->
    <path d="M140 176 L140 212"/>
    <!-- categories -> reports -->
    <path d="M240 133 L315 133 L315 219 L390 219"/>
    <!-- breeds -> reports -->
    <path d="M240 248 L315 248 L315 234 L390 234"/>
    <!-- locations -> reports -->
    <path d="M240 379 L340 379 L340 249 L390 249"/>
    <!-- users -> reports (user_id) -->
    <path d="M240 636 L300 636 L300 204 L390 204"/>
    <!-- users -> reports (assigned_staff_id) -->
    <path d="M240 660 L270 660 L270 264 L390 264"/>
    <!-- reports -> report_images -->
    <path d="M620 200 L690 200 L690 140 L760 140"/>
    <!-- reports -> status_logs -->
    <path d="M620 260 L690 260 L690 280 L760 280"/>
    <!-- reports -> match_claims (lost) -->
    <path d="M620 300 L660 300 L660 418 L760 418"/>
    <!-- reports -> match_claims (found) -->
    <path d="M620 320 L640 320 L640 433 L760 433"/>
    <!-- match_claims -> match_signals -->
    <path d="M970 418 L1105 418"/>
    <!-- users -> status_logs — routed under the bottom row, then up the clear
         channel between moderation_cases and the legend -->
    <path d="M180 748 L180 780 L1078 780 L1078 295 L970 295"/>
    <!-- users -> match_claims (submitted_by / reviewed_by) -->
    <path d="M210 748 L210 800 L1092 800 L1092 463 L970 463"/>
    <!-- users -> notifications -->
    <path d="M240 652 L450 652"/>
    <!-- reports -> notifications -->
    <path d="M505 480 L505 600"/>
    <!-- match_claims -> notifications -->
    <path d="M865 514 L865 560 L600 560 L600 600"/>
    <!-- reports -> moderation -->
    <path d="M580 480 L580 540 L920 540 L920 600"/>
    <!-- users -> moderation -->
    <path d="M240 742 L780 742 L780 667 L830 667"/>
