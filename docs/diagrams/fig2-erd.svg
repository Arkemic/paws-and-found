  <!-- ================= LEGEND ================= -->
  <rect x="1105" y="600" width="275" height="148" rx="6" fill="#F8FAFA" stroke="#DDE6E4"/>
  <text x="1118" y="622" font-size="12" font-weight="700" fill="#21302F">Key relationships</text>
  <text x="1118" y="643" font-size="10.5" fill="#3C4A49">One user files many pet_reports</text>
  <text x="1118" y="659" font-size="10.5" fill="#3C4A49">One report holds many report_images</text>
  <text x="1118" y="675" font-size="10.5" fill="#3C4A49">One report holds many status_logs</text>
  <text x="1118" y="691" font-size="10.5" fill="#3C4A49">One match_claim links exactly two reports</text>
  <text x="1118" y="707" font-size="10.5" fill="#3C4A49">One match_claim holds seven match_signals</text>
  <text x="1118" y="723" font-size="10.5" fill="#3C4A49">One category has many breeds and reports</text>
  <text x="1118" y="739" font-size="10.5" fill="#3C4A49">One user receives many notifications</text>

  <!-- ================= NOTE ================= -->
  <rect x="40" y="822" width="1340" height="76" rx="6" fill="#FFF8EC" stroke="#E5BE85"/>
  <text x="56" y="844" font-size="12" font-weight="700" fill="#9A620F">Changes from the initial ERD</text>
  <text x="56" y="864" font-size="11.5" fill="#3C4A49">Three tables were added: match_signals (stores why each pairing scored what it did, so matching is explainable rather than a black box),</text>
  <text x="56" y="880" font-size="11.5" fill="#3C4A49">notifications (the events users are told about), and moderation_cases (community flags and the administrator's decision). The users table gained</text>
  <text x="56" y="896" font-size="11.5" fill="#3C4A49">account_status for suspension, and pet_reports gained the three contact-preference flags that keep private details out of public listings.</text>
</svg>
